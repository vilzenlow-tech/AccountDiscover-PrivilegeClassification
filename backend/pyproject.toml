[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adpct-backend"
version = "0.1.0"
description = "Account Discovery and Privilege Classification Tool - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "celery>=5.4",
    "redis>=5.0",
    "APScheduler>=3.10",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "jinja2>=3.1",
    "structlog>=24.1",
    "email-validator>=2.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "paramiko>=3.4",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "pymongo>=4.7",
    "oracledb>=2.0",
    "pywinrm>=0.4",
    "anthropic>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
